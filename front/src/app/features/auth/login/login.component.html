<div class="login-page">
  <mat-card class="login-card">
    <mat-card-header>
      <mat-card-title>Connexion</mat-card-title>
      <mat-card-subtitle>(formulaire placeholder, non implémenté)</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form>
        <mat-form-field appearance="outline">
          <mat-label>Email ou nom d'utilisateur</mat-label>
          <input matInput type="text" autocomplete="username" />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Mot de passe</mat-label>
          <input matInput type="password" autocomplete="current-password" />
          <button mat-icon-button matSuffix type="button">
            <mat-icon>visibility_off</mat-icon>
          </button>
        </mat-form-field>

        <button mat-raised-button color="primary" type="submit">
          Se connecter
        </button>
      </form>
    </mat-card-content>

    <mat-card-actions>
      <span>Pas encore inscrit ?</span>
      <a mat-button routerLink="/register">Créer un compte</a>
    </mat-card-actions>
  </mat-card>
</div>
