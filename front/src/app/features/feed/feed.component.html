<mat-toolbar color="primary" class="navbar">
  <span class="navbar-title">MDD</span>
  <span class="spacer"></span>
  <button mat-icon-button><mat-icon>newspaper</mat-icon></button>
  <button mat-icon-button><mat-icon>tag</mat-icon></button>
  <button mat-icon-button><mat-icon>account_circle</mat-icon></button>
</mat-toolbar>

<div class="feed-container">
  <div class="feed-header">
    <h1>Fil d'actualité</h1>
    <button mat-fab extended color="primary">
      <mat-icon>edit</mat-icon>
      Créer un article
    </button>
  </div>
  
  <p>(placeholder, non implémenté)</p>

  <div class="post-list">
    @for (post of placeholderPosts; track post.id) {
      <mat-card class="post-card">
        <mat-card-header>
          <mat-chip-set>
            <mat-chip>{{ post.topic }}</mat-chip>
          </mat-chip-set>
          <span class="post-meta">{{ post.author }} · {{ post.date }}</span>
        </mat-card-header>
        <mat-card-content>
          <h2 class="post-title">{{ post.title }}</h2>
          <p class="post-excerpt">{{ post.excerpt }}</p>
        </mat-card-content>
        <mat-card-actions>
          <button mat-button>
            Lire la suite
            <mat-icon iconPositionEnd>arrow_forward</mat-icon>
          </button>
        </mat-card-actions>
      </mat-card>
    }
  </div>
</div>
